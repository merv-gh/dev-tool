name: Release evidence
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  deep:
    uses: ./.github/workflows/deep-verification.yml
  package:
    needs: [verify, deep]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:check
      - run: node dev/docs-check.js
      - run: npm run test:coverage
        env:
          DT_COVERAGE_OUTPUT: work/release/coverage.json
      - run: node dev/coverage-gate.js work/release/coverage.json
      - run: |
          node dev/release-inventory.js work/release/tool-verification.json
          npm sbom --omit=dev --sbom-format cyclonedx > work/release/sbom.json
          tar -czf work/release/dev-tool.tar.gz -C dist .
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: work/release/dev-tool.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ github.sha }}
          path: work/release
          if-no-files-found: error
