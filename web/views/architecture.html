<style>.av-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.av-head h1{font-size:16px;margin:0}.av-nodes{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.av-node{padding:12px 16px;border:1px solid var(--line);border-radius:6px;background:var(--soft)}.av-node small{display:block;color:var(--muted)}.av-step{border-top:1px solid var(--line);padding:9px 0}.av-step summary{cursor:pointer}.av-step p,.av-step pre{overflow-wrap:anywhere;white-space:pre-wrap}.av-meta{color:var(--muted);font-size:11px}</style>
<div class="av-head"><h1 data-title></h1><span id="av-type" class="av-meta"></span></div><p id="av-summary"></p><div id="av-nodes" class="av-nodes"></div><div id="av-steps"></div><details><summary>Coverage and gaps</summary><pre id="av-gaps"></pre></details><details><summary>Complete bounded snapshot</summary><div id="av-data"></div></details><p class="av-meta">Declared ownership and field mappings do not prove runtime execution. Consul replica registrations describe deployment observations.</p>
<script>
const D=DATA||{},E=dt.esc;dt.title(D.title||'Architecture');dt.$('#av-type').textContent=(D.type||'')+' · '+(D.env||'');dt.$('#av-summary').textContent=D.document?.summary||D.guidance||'';
dt.$('#av-nodes').innerHTML=(D.nodes||[]).map(n=>'<div class="av-node">'+E(n.name)+'<small>'+E(n.kind)+'</small></div>').join('');dt.$('#av-steps').innerHTML=(D.relations||[]).map((r,i)=>'<details class="av-step"><summary>'+E(r.order||i+1)+'. '+E(r.label)+' · '+E(r.certainty)+'</summary><p>'+E(r.from)+' → '+E(r.to)+'</p><pre>'+E((r.fields||[]).map(f=>f.from+' → '+f.to).join('\n'))+'</pre><p class="av-meta">'+E((r.evidence||[]).join('\n'))+'</p></details>').join('');dt.$('#av-gaps').textContent=dt.prettyJson(D.gaps||[]);dt.json(dt.$('#av-data'),D);
</script>
