<style>
.knowledge{display:grid;gap:18px;min-width:0}.knowledge>*{min-width:0}.knowledge p{margin:0;max-width:78ch;line-height:1.55}.knowledge h2{font-size:15px;margin:0 0 10px}.knowledge .toolbar{display:flex;align-items:end;gap:12px;flex-wrap:wrap}.knowledge label{display:grid;gap:5px;font-size:12px}.knowledge input{width:260px;max-width:100%;box-sizing:border-box}.knowledge .layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,340px);gap:20px;align-items:start}.knowledge .map{overflow:auto;max-height:520px;min-height:220px;background:var(--panel);border:1px solid var(--line);border-radius:10px}.knowledge svg{display:block;width:100%;min-width:560px}.knowledge svg rect{fill:var(--panel);stroke:var(--line)}.knowledge svg text{fill:var(--fg);font:12px system-ui}.knowledge svg .kind{fill:var(--muted);font-size:10px}.knowledge svg path{stroke:var(--muted);fill:none}.knowledge svg path.stated{stroke-dasharray:5 4}.knowledge svg g[role=button]{cursor:pointer}.knowledge svg g[aria-pressed=true] rect,.knowledge svg g:focus rect{stroke:var(--accent);stroke-width:2}.knowledge .list{display:flex;gap:5px;flex-wrap:wrap;max-height:180px;overflow:auto}.knowledge .list button{font-size:12px;text-align:left;overflow-wrap:anywhere}.knowledge .detail{display:grid;gap:14px;overflow-wrap:anywhere}.knowledge .detail dl{display:grid;grid-template-columns:75px minmax(0,1fr);gap:6px;font-size:12px;margin:0}.knowledge dt{color:var(--muted)}.knowledge dd{margin:0}.knowledge pre{max-height:240px;overflow:auto}.knowledge .legend{font-size:12px;color:var(--muted)}.knowledge .gap-list{margin:0;padding-left:19px;display:grid;gap:6px;font-size:12px}.knowledge .relation-list{display:grid;gap:6px;max-height:260px;overflow:auto}.knowledge .relation-list button{white-space:normal;text-align:left;font-size:12px}.knowledge [data-status]{color:var(--muted);font-size:12px}.knowledge .excerpt{font-size:13px;border-top:1px solid var(--line);padding-top:12px}.knowledge .empty{padding:24px;color:var(--muted);font-size:13px}@media(max-width:760px){.knowledge .layout{grid-template-columns:minmax(0,1fr)}.knowledge input{width:100%}.knowledge .toolbar label{flex:1;min-width:150px}}
</style>
<main class="knowledge">
<header><h1 data-title>System knowledge</h1><p data-summary></p></header>
<div class="toolbar"><label>Find an entity<input id="entity-filter" type="search" placeholder="Service, table, topic or endpoint"></label><label>Relationship evidence<select id="evidence-filter"><option value="all">All evidence</option><option value="indexed">Indexed code / catalog</option><option value="stated">Stated in a source</option></select></label><button id="zoom-in" type="button" aria-label="Zoom in">Zoom in</button><button id="zoom-out" type="button" aria-label="Zoom out">Zoom out</button><button id="reset-map" type="button">Reset view</button><button id="download-map" type="button">Download JSON</button></div>
<div class="layout"><section><div class="map" aria-label="Directional relationship map"><svg id="knowledge-svg" role="img" aria-label="Entities connected by directional relationships"></svg></div><p class="legend">Solid: indexed code or catalog evidence. Dashed: a source states the relationship. These are evidence classifications, not runtime proof. Arrowheads point toward the relationship target.</p><p data-status aria-live="polite"></p><div class="list" id="entity-list" aria-label="Entities"></div></section><aside class="detail" id="entity-detail" aria-live="polite"><p>Select an entity to inspect its evidence.</p></aside></div>
<section><h2>Relationships</h2><div id="relation-list" class="relation-list"></div></section><section><h2>Evidence gaps</h2><ul id="gap-list" class="gap-list"></ul></section>
</main>
<script>
(()=>{'use strict';
const model=DATA, nodes=model.nodes||[], edges=model.relations||[], byId=new Map(nodes.map(n=>[n.id,n])), esc=dt.esc;
let selected=nodes[0]?.id, scale=1, width=900,height=400;
dt.title(META.title||'System knowledge');
dt.$('[data-summary]').textContent=`${model.env||'Environment'} · ${nodes.length} of ${model.total??nodes.length} entities · ${edges.length} relationships${model.truncated?' · bounded result; focus an exact entity to continue':''}. Sources update independently.`;
const name=id=>byId.get(id)?.name||id;
function select(id){selected=id;detail();draw();}
function detail(){const n=byId.get(selected), el=dt.$('#entity-detail');if(!n){el.innerHTML='<p>No entity matches. Broaden the filter or sync a configured source.</p>';return;}
el.innerHTML=`<section><h2>${esc(n.name)}</h2><dl><dt>Type</dt><dd>${esc(n.kind)}</dd><dt>Identity</dt><dd><code>${esc(n.id)}</code></dd></dl></section><section><h2>Source evidence</h2><div id="node-evidence"></div></section><section><h2>Connected entities</h2><div class="relation-list" id="node-neighbors"></div></section><section id="node-documents"><h2>Documentation</h2></section>`;
dt.json(dt.$('#node-evidence'),n.evidence||[n.provenance||{}],{open:2});
for(const r of edges.filter(r=>r.from===n.id||r.to===n.id)){const id=r.from===n.id?r.to:r.from,b=document.createElement('button');b.type='button';b.textContent=`${name(r.from)} → ${r.kind} → ${name(r.to)}`;b.onclick=()=>select(id);dt.$('#node-neighbors').append(b);}
const docs=(model.documents||[]).filter(d=>(d.entities||[]).includes(n.id));if(!docs.length)dt.$('#node-documents').insertAdjacentHTML('beforeend','<p class="muted">No linked documentation in this bounded result.</p>');
for(const d of docs.slice(0,8)){const box=document.createElement('div');box.className='excerpt';const h=document.createElement('strong');h.textContent=d.title;const p=document.createElement('p');p.textContent=d.text;const small=document.createElement('p');small.className='muted';small.textContent=`${d.provenance?.source||''} · ${d.provenance?.file||d.id} · ${String(d.provenance?.revision||'').slice(0,14)}`;box.append(h,p,small);dt.$('#node-documents').append(box);}}
function draw(){const q=dt.$('#entity-filter').value.toLowerCase().trim(),proof=dt.$('#evidence-filter').value, filtered=nodes.filter(n=>`${n.id} ${n.name} ${n.kind}`.toLowerCase().includes(q));
const visible=filtered.slice(0,60),visibleIds=new Set(visible.map(n=>n.id)), relations=edges.filter(r=>visibleIds.has(r.from)&&visibleIds.has(r.to)&&(proof==='all'||r.proof===proof));
dt.$('[data-status]').textContent=`Showing ${visible.length} entities and ${relations.length} relationships${filtered.length>60?' (first 60; narrow the filter)':''}.`;
const kinds=[...new Set(visible.map(n=>n.kind))].sort((a,b)=>['endpoint','service','topic','database','table','external','unresolved'].indexOf(a)-['endpoint','service','topic','database','table','external','unresolved'].indexOf(b));
const positions=new Map();height=Math.max(240,...kinds.map(k=>visible.filter(n=>n.kind===k).length*90+55));width=Math.max(600,kinds.length*240);
for(const [i,kind] of kinds.entries())visible.filter(n=>n.kind===kind).forEach((n,j)=>positions.set(n.id,{x:i*240+20,y:j*90+30}));
const svg=dt.$('#knowledge-svg');svg.setAttribute('viewBox',`0 0 ${width/scale} ${height/scale}`);svg.setAttribute('height',String(Math.min(height,500)));
svg.innerHTML='<defs><marker id="knowledge-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" style="fill:var(--muted);stroke:none"></path></marker></defs>';
for(const r of relations.slice(0,400)){const a=positions.get(r.from),b=positions.get(r.to),x1=a.x+198,y1=a.y+29,x2=b.x,y2=b.y+29,mid=(x1+x2)/2;svg.insertAdjacentHTML('beforeend',`<path class="${r.proof==='stated'?'stated':''}" d="M ${x1} ${y1} C ${mid} ${y1},${mid} ${y2},${x2} ${y2}" marker-end="url(#knowledge-arrow)"><title>${esc(name(r.from)+' '+r.kind+' '+name(r.to))}</title></path>`);}
for(const n of visible){const p=positions.get(n.id),g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('transform',`translate(${p.x},${p.y})`);g.setAttribute('role','button');g.setAttribute('tabindex','0');g.setAttribute('aria-label',`${n.kind}: ${n.name}`);g.setAttribute('aria-pressed',String(selected===n.id));const label=String(n.name);g.innerHTML=`<rect width="198" height="60" rx="7"></rect><text x="10" y="18" class="kind">${esc(n.kind)}</text><text x="10" y="38">${esc(label.length>25?label.slice(0,23)+'…':label)}</text><title>${esc(n.id)}</title>`;g.onclick=()=>select(n.id);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(n.id);}};svg.append(g);}
const list=dt.$('#entity-list');list.replaceChildren();for(const n of filtered.slice(0,150)){const b=document.createElement('button');b.type='button';b.textContent=n.name;b.setAttribute('aria-pressed',String(selected===n.id));b.onclick=()=>select(n.id);list.append(b);}
const relationList=dt.$('#relation-list');relationList.replaceChildren();for(const r of relations.slice(0,200)){const b=document.createElement('button');b.type='button';b.textContent=`${name(r.from)} → ${r.kind} → ${name(r.to)} · ${r.proof||r.confidence||'unknown'}`;b.onclick=()=>{select(r.from);const box=document.createElement('section'),h=document.createElement('h2');h.textContent='Relationship evidence';box.append(h);const value=document.createElement('div');box.append(value);dt.json(value,r,{open:2});dt.$('#entity-detail').prepend(box);};relationList.append(b);}if(!visible.length)svg.innerHTML='<text x="24" y="60">No matching entities. Broaden the filter or update a knowledge source.</text>';}
dt.$('#entity-filter').oninput=draw;dt.$('#evidence-filter').onchange=draw;dt.$('#zoom-in').onclick=()=>{scale=Math.min(3,scale*1.2);draw();};dt.$('#zoom-out').onclick=()=>{scale=Math.max(.5,scale/1.2);draw();};dt.$('#reset-map').onclick=()=>{scale=1;draw();};
dt.$('#download-map').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(model,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='system-knowledge.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
const gapList=dt.$('#gap-list');for(const gap of (model.gaps||[]).slice(0,100)){const li=document.createElement('li');li.textContent=JSON.stringify(gap);gapList.append(li);}if(!(model.gaps||[]).length){const li=document.createElement('li');li.textContent='No gaps in the available indexed evidence. Runtime behavior still requires application tests.';gapList.append(li);}detail();draw();})();
</script>
