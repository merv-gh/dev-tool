<!-- {"description":"Exact differential observations with case selection, baseline/candidate JSON and explicit proof coverage","sample":{"outcome":"equivalent","profile":"projection","counts":{"cases":1,"equal":1},"versions":[{"workspace":"before","revision":"abc"},{"workspace":"after","revision":"def"}],"proof":{"type":"executed-differential","coverage":"declared inputs only"},"cases":[{"id":"tenant-22","equal":true,"baseline":{"status":"returned","value":null},"candidate":{"status":"returned","value":null}}]}} -->
<style>.diff-head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.diff-grid>section{min-width:0}.diff-cases{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.diff-cases button[aria-pressed=true]{outline:2px solid var(--accent)}.diff-json{max-height:65vh;overflow:auto}.diff-status{font-weight:700}@media(max-width:640px){.diff-grid{grid-template-columns:1fr}}</style>
<div class="diff-head"><h2 data-title></h2><span id="counts" class="muted"></span></div>
<p id="coverage" class="muted"></p><details><summary>Revisions, target and normalization</summary><div id="provenance"></div></details>
<nav id="cases" class="diff-cases" aria-label="Differential cases"></nav>
<div class="diff-grid"><section class="card"><h3>Baseline</h3><div id="before" class="diff-json"></div></section><section class="card"><h3>Candidate</h3><div id="after" class="diff-json"></div></section></div>
<script>
dt.title(`Differential: ${DATA.outcome}`);dt.$('#counts').textContent=`${DATA.counts.equal} / ${DATA.counts.cases} cases equal`;dt.$('#coverage').textContent=DATA.proof.coverage;dt.json(dt.$('#provenance'),{profile:DATA.profile,versions:DATA.versions,execution:DATA.execution,normalizers:DATA.normalizers,proof:DATA.proof});
const select=(c,b)=>{for(const btn of dt.$('#cases').children)btn.setAttribute('aria-pressed',String(btn===b));dt.json(dt.$('#before'),c.baseline,{open:4});dt.json(dt.$('#after'),c.candidate,{open:4});};for(const c of DATA.cases){const b=document.createElement('button');b.type='button';b.textContent=`${c.equal?'✓':'✗'} ${c.id}`;b.onclick=()=>select(c,b);dt.$('#cases').appendChild(b);}if(DATA.cases.length)select(DATA.cases[0],dt.$('#cases').firstChild);
</script>
