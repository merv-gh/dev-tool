<!-- {"description":"Inspect a portable scenario or actual-service run: dependency/action/effect connections, assertion results, timeline, proof boundaries and full evidence.","sample":{"ok":false,"session":"sample","proof":{"level":"process","applicationExecuted":true,"independentObservations":true,"runtimeReadsVerified":false,"network":"none"},"checks":{"passed":1,"failed":1,"results":[{"id":"status","ok":true,"reason":"matched"},{"id":"receipt","ok":false,"reason":"exact expectation did not match"}]},"violations":[{"kind":"unexpected-file-effect","path":"outbox/extra.json"}],"events":[{"at":"2026-10-28T12:00:00Z","kind":"started"},{"at":"2026-10-28T12:00:01Z","kind":"http","state":"limits","request":{"method":"GET","path":"/limits/42","body":null}}],"observed":{"status":201,"receipt":{"orderId":42,"total":"12.50"}},"temporal":{"elapsedMs":202,"quietMs":200,"samples":5}}} -->
<style>
.scenario {display:grid;gap:18px;min-width:0;font-variant-numeric:tabular-nums}.scenario>*{min-width:0}.scenario .status{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.scenario .proof{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--soft);line-height:1.5}.scenario .proof p{margin:3px 0}.scenario .layout{display:grid;grid-template-columns:minmax(170px,230px) minmax(0,1fr);gap:18px;align-items:start}.scenario nav{display:grid;gap:5px}.scenario nav button{text-align:left;overflow-wrap:anywhere;white-space:normal}.scenario nav button[aria-pressed=true]{border-color:var(--accent);background:var(--soft)}.scenario .panel{min-width:0;display:grid;gap:12px}.scenario h2{font-size:14px;margin:0}.scenario p{max-width:80ch;overflow-wrap:anywhere}.scenario .bad{color:var(--bad)}.scenario .good{color:var(--good)}.scenario .timeline{list-style:none;padding:0;display:grid;gap:8px}.scenario .timeline li{border-left:2px solid var(--line);padding:4px 12px;overflow-wrap:anywhere}.scenario .timeline time{display:inline-block;min-width:130px;color:var(--muted);font-size:12px}.scenario .toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.scenario label{display:grid;gap:4px;font-size:12px;flex:1;min-width:170px}.scenario input{width:100%;box-sizing:border-box}.scenario pre{max-height:500px;overflow:auto}.scenario .graph{display:flex;gap:10px;overflow:auto;padding:12px 0;align-items:center}.scenario .node{border:1px solid var(--line);border-radius:8px;padding:12px;min-width:140px;max-width:240px;overflow-wrap:anywhere}.scenario .arrow{color:var(--muted)}.scenario button:focus-visible,.scenario input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}@media(max-width:640px){.scenario .layout{grid-template-columns:1fr}.scenario nav{grid-template-columns:repeat(2,minmax(0,1fr))}.scenario .timeline time{display:block}}
</style>
<main class="scenario">
 <div class="vhead"><h1 data-title>Scenario evidence</h1><span class="spacer"></span><button type="button" id="scenario-download" class="small">Download evidence</button></div>
 <div class="status" id="scenario-status" role="status"></div>
 <div class="proof" id="scenario-proof"></div>
 <div id="scenario-graph" class="graph" aria-label="Scenario stages"></div>
 <div class="toolbar"><label for="scenario-search">Search evidence<input type="search" id="scenario-search" placeholder="A dependency, assertion, path or event" autocomplete="off"></label></div>
 <div class="layout"><nav id="scenario-tabs" aria-label="Evidence sections"></nav><section class="panel" id="scenario-panel" aria-live="polite"></section></div>
</main>
<script>
(()=>{const D=DATA||{},E=dt.esc;let search='',selected='checks';const result=D.checks||D.proof?D:D.session?.result||D.result||D;const artifact=D.artifact?.contract?D.artifact:null;const contract=artifact?.contract;const proof=result.proof||D.proof||D.session?.proof||artifact?.proof||{level:'discovery',applicationExecuted:false,runtimeReadsVerified:false};
dt.title(META.title||'Scenario evidence');dt.$('#scenario-status').innerHTML=`<strong class="${result.ok===false||D.ok===false?'bad':result.ok===true||D.ok===true?'good':''}">${result.ok===false||D.ok===false?'Checks need attention':result.ok===true||D.ok===true?'Stage passed':'Scenario stage'}</strong><span>${E(D.service||D.session?.service||artifact?.service||'')}</span><span class="muted">${E(typeof D.session==='string'?D.session:D.session?.id||'')}</span>`;
dt.$('#scenario-proof').innerHTML=`<strong>Evidence level: ${E(proof.level||'discovery')}</strong><p>${proof.applicationExecuted?'The application was executed.':'This stage has not executed the application.'} ${proof.independentObservations===true?'Effects were collected independently.':proof.independentObservations?'Effect assertions belong to the project test adapter.':''}</p><p class="muted">${proof.runtimeReadsVerified?'Runtime reads verified.':'Complete runtime dependency coverage has not been established.'} ${proof.network?`Network boundary: ${E(proof.network)}.`:''}</p>`;
const counts={states:contract?.inventory?.states?.length||D.states?.length||0,actions:contract?.actions?.actions?.length||D.actions?.length||D.session?.actions?.length||0,effects:contract?.expectations?.expectations?.length||result.checks?.results?.length||D.expectations?.length||0};dt.$('#scenario-graph').innerHTML=['states','actions','effects'].map((key,i)=>`${i?'<span class="arrow" aria-hidden="true">→</span>':''}<div class="node"><strong>${counts[key]} ${key}</strong><div class="muted">${{states:'Arrange declared reads',actions:'Apply bound inputs',effects:'Observe and assert'}[key]}</div></div>`).join('');
const sections=[['checks','Assertions',result.checks?.results||[]],['gaps','Gaps and violations',[...(D.gaps||D.preflight?.gaps||[]),...(result.violations||[]),...(result.checks?.gaps||[])]],['timeline','Event timeline',D.events||result.events||[]],['observed','Observed values',result.observed||{}],['contract','Scenario contract',contract||{states:D.states,actions:D.actions,expectations:D.expectations}],['changes','Changes',D.changes||[]],['raw','Full evidence',D]];
function matches(value){return!search||JSON.stringify(value).toLowerCase().includes(search)}function draw(){dt.$('#scenario-tabs').innerHTML=sections.map(([id,title,value])=>`<button type="button" data-tab="${id}" aria-pressed="${selected===id}">${E(title)}${Array.isArray(value)?` · ${value.length}`:''}</button>`).join('');for(const button of dt.$('#scenario-tabs').querySelectorAll('button'))button.onclick=()=>{selected=button.dataset.tab;draw()};const [id,title,value]=sections.find(s=>s[0]===selected)||sections[0],panel=dt.$('#scenario-panel');panel.innerHTML=`<h2>${E(title)}</h2><div id="scenario-content"></div>`;const content=dt.$('#scenario-content');if(id==='timeline'){const rows=value.filter(matches);content.innerHTML=rows.length?`<ol class="timeline">${rows.map(v=>`<li><time>${E(v.at||'')}</time><strong>${E(v.kind||'event')}</strong> ${E(v.state||v.action||'')}<div class="muted">${E(v.request?`${v.request.method} ${v.request.path}`:v.reason||v.error||'')}</div></li>`).join('')}</ol>`:'<p class="muted">No matching runtime events have been collected.</p>'}else if(Array.isArray(value)){const rows=value.filter(matches);if(rows.length)dt.table(content,rows);else content.innerHTML='<p class="muted">No matching records in this section.</p>'}else if(matches(value))dt.json(content,value,{open:1});else content.innerHTML='<p class="muted">No matching evidence.</p>'}
dt.$('#scenario-search').oninput=e=>{search=e.target.value.trim().toLowerCase();draw()};dt.$('#scenario-download').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='scenario-evidence.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};draw()})();
</script>
