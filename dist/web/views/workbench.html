<header class="wx-heading"><h1>Interactive workbench</h1><span id="wx-scope" class="wx-note"></span></header>
<p class="wx-note">Browse retained work here. Open the authenticated workbench to edit files, switch branch workspaces or run tests, scripts and API actions.</p>
<div class="wx-layout"><section><div id="wx-modes" class="wx-modes" role="group" aria-label="Browse by"></div><label class="sr-only" for="wx-filter">Filter retained names</label><input id="wx-filter" type="search" placeholder="Filter retained names"><nav id="wx-tree" class="wx-tree" aria-label="Retained work navigator"></nav><p id="wx-count" class="wx-note" role="status"></p></section><section id="wx-detail" aria-live="polite"></section></div>
<p id="wx-gaps" class="wx-note"></p>
<script>
(()=>{
 const $=id=>document.getElementById(id),data=DATA||{},trees=data.trees||{},labels={contexts:'Contexts',services:'Services',tasks:'Tasks'},esc=dt.esc;let mode=data.mode||'contexts',selected=data.selected;
 function link(ref){if(ref?.kind?.startsWith('service-')&&ref.service)ref={kind:'service',service:ref.service};const u=new URL(data.url||'/workbench',location.href);if(u.pathname!=='/workbench'||!['http:','https:'].includes(u.protocol))throw Error('Invalid workbench destination');u.searchParams.set('mode',mode);for(const k of ['context','service','task','node'])u.searchParams.delete(k);if(ref){u.searchParams.set('node',btoa(unescape(encodeURIComponent(JSON.stringify(ref)))).replaceAll('+','-').replaceAll('/','_').replace(/=+$/,''));}return u.href;}
 function details(item){selected=item;const target=link(item?.ref),root=$('wx-detail');root.innerHTML='<h2>'+esc(item?.title||item?.label||'Choose a starting point')+'</h2><p>'+esc(item?.summary||item?.detail||'Choose a context, service or ticket; continue with live actions in Workbench.')+'</p><dl>'+Object.entries(item?.identity||{}).map(([k,v])=>'<dt>'+esc(k)+'</dt><dd>'+esc(Array.isArray(v)?v.join(', '):v)+'</dd>').join('')+'</dl><div class="wx-links"><a href="'+esc(target)+'" target="_blank" rel="noopener">Open live workbench</a><button id="wx-copy">Copy workbench link</button></div>'+(item?.actions?.length?'<h3>Available in Workbench</h3><ul class="wx-actions">'+item.actions.map(a=>'<li>'+esc(a)+'</li>').join('')+'</ul>':'')+(item?.workspaces?.length?'<h3>Linked workspaces</h3><ul class="wx-actions">'+item.workspaces.map(w=>'<li>'+esc(w.ref||w.id)+' · '+esc(w.repo)+'</li>').join('')+'</ul>':'');$('wx-copy').onclick=()=>dt.copy(target);}
 function render(){const query=$('wx-filter').value.trim().toLowerCase(),tree=trees[mode]||{nodes:[],gaps:['No retained inventory for this lens']},flat=[];let count=0;
  const draw=nodes=>'<ul>'+nodes.map(n=>{const group=n.ref?.kind==='service-group',children=n.children||[],matches=(n.label+' '+n.detail).toLowerCase().includes(query);if(query&&!matches&&!children.some(c=>(c.label+' '+c.detail).toLowerCase().includes(query)))return '';count++;if(group)return '<li><details open><summary>'+esc(n.label)+'<small>'+esc(n.detail||'')+'</small></summary>'+draw(children)+'</details></li>';const index=flat.push(n)-1,current=JSON.stringify(n.ref)===JSON.stringify(selected?.ref),related=JSON.stringify(n.ref)===JSON.stringify(data.selected?.ref)?data.children?.nodes:[];return '<li><button data-index="'+index+'" aria-current="'+String(current)+'">'+esc(n.label)+'<small>'+esc(n.detail||'')+'</small></button>'+(related?.length?'<details open><summary>Related retained items</summary>'+draw(related)+'</details>':'')+'</li>';}).join('')+'</ul>';
  $('wx-modes').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));$('wx-tree').innerHTML=draw(tree.nodes||[]);$('wx-tree').querySelectorAll('button').forEach(b=>b.onclick=()=>{const n=flat[Number(b.dataset.index)];details(JSON.stringify(n.ref)===JSON.stringify(data.selected?.ref)?data.selected:n);$('wx-tree').querySelectorAll('button').forEach(row=>row.setAttribute('aria-current',String(row===b)));});$('wx-count').textContent=count+' shown · '+(tree.total||0)+' root entries'+(tree.nextCursor!=null?' · more in live Workbench':'');$('wx-gaps').textContent=[...(data.gaps||[]),...(tree.gaps||[])].join(' · ');}

 $('wx-scope').textContent=(data.env||'')+' · snapshot '+(data.at||'');for(const [key,label]of Object.entries(labels)){const b=document.createElement('button');b.type='button';b.textContent=label;b.dataset.mode=key;b.onclick=()=>{mode=key;$('wx-filter').value='';details(null);render();};$('wx-modes').append(b);}$('wx-filter').oninput=render;details(selected);render();
})();
</script>
