<!-- {"description":"Persistent disposable service environment: progress, source identities, expiry and supervisor link. Snapshot does not execute actions.","sample":{"id":"run-example","name":"orders-investigation","state":"ready","generation":1,"services":{"orders":{"name":"orders","state":"ready","revision":{"commit":"example-commit"}}},"dependencies":{"postgres":"ready"},"ui":"/admin#environments?run=run-example"}} -->
<section id="seSnapshot"></section>
<script>
(function(){const data=DATA,E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const runs=data.runs||[data],services=r=>Array.isArray(r.services)?r.services:Object.values(r.services||{});document.getElementById('seSnapshot').innerHTML='<h2>'+E(data.name||'Service environments')+'</h2>'+runs.filter(r=>r.id).map(r=>'<section><h3>'+E(r.name||r.id)+' · '+E(r.state)+'</h3><p>'+E(r.id)+(r.expiresAt?' · expires '+E(r.expiresAt):'')+'</p>'+(r.error?'<p>'+E(r.error)+'</p>':'')+'<ul>'+services(r).map(s=>'<li>'+E(s.name)+' · '+E(s.state||r.state)+' · '+E(s.revision?.commit||'Build pending')+'</li>').join('')+'</ul><p><a href="'+E(META.publicUrl||'')+E(r.ui||'/admin#environments?run='+encodeURIComponent(r.id))+'" target="_blank" rel="noopener">Open supervisor</a></p><details'+(r.error?' open':'')+'><summary>Progress and configuration</summary><pre>'+E(JSON.stringify(r,null,2))+'</pre></details></section>').join('')+(!data.id?'<p>'+E((data.definitions||[]).length)+' saved definitions. Open Admin → Service environments to create or select one.</p>':'')+'<p>Retained snapshot. Open the supervisor for current state and explicit actions.</p>';})();
</script>
