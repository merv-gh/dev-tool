<style>.wr-head,.wr-actions{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.wr h1{font-size:20px;margin:0}.wr .wr-status{color:var(--muted);font-size:12px}.wr p{max-width:75ch}.wr pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px var(--mono);max-height:480px;overflow:auto}.wr section,.wr>details{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}.wr h2{font-size:15px;margin:0 0 10px}.wr input{width:100%;max-width:480px}.wr .wr-scroll{overflow:auto}.wr table{width:100%;min-width:640px;font-size:12px;border-collapse:collapse}.wr th,.wr td{text-align:left;padding:9px;border-bottom:1px solid var(--line);overflow-wrap:anywhere;vertical-align:top}.wr th{color:var(--muted)}.wr th:first-child{min-width:160px}.wr th:nth-child(2),.wr th:nth-child(3){min-width:80px}.wr .wr-file{padding:9px 0}.wr .wr-file>summary{font-family:var(--mono);font-size:12px}.wr button{white-space:normal}.wr .wr-warning{background:var(--warn-bg);color:var(--warn);padding:10px;border-radius:7px}.wr .wr-briefing{background:var(--soft);padding:12px}.wr .wr-directory{padding-left:16px;border-left:1px solid var(--line)}@media(max-width:600px){.wr .wr-scroll{max-width:100%}.wr th,.wr td{padding:7px}}
</style><main class="wr"><header class="wr-head"><h1 id="wr-title"></h1><span class="wr-status" id="wr-status"></span></header><p class="hint" id="wr-purpose"></p><div class="wr-actions"><input id="wr-filter" type="search" aria-label="Filter retained evidence" placeholder="Filter retained files, dependencies or checkpoints"><button id="wr-export">Download retained record</button><a href="/studio" target="_blank" rel="noopener noreferrer">Open Developer studio</a></div><div id="wr-main"></div><details><summary>Complete retained record</summary><pre id="wr-raw"></pre></details></main>
<script>(()=>{const d=DATA,r=d.result||{},E=dt.esc,$=id=>document.getElementById(id),pretty=v=>JSON.stringify(v,null,2);$('wr-title').textContent=r.title||r.taskId||d.tool?.replaceAll('_',' ')||'Work record';$('wr-status').textContent=[r.state||r.status,r.repo,r.sha?.slice(0,12),r.revision?.slice(0,12)].filter(Boolean).join(' · ');$('wr-purpose').textContent=r.guidance||r.note||r.coverage||'Retained observation. Opening this view does not resume work, execute tools or invoke a model.';$('wr-raw').textContent=pretty(d);const matches=(v,q)=>!q||JSON.stringify(v).toLowerCase().includes(q);const table=(rows,cols)=>'<div class="wr-scroll"><table><thead><tr>'+cols.map(c=>'<th>'+E(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+cols.map(c=>'<td>'+E(row[c]===undefined?'—':typeof row[c]==='object'?JSON.stringify(row[c]):row[c])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';function section(title,body){return '<section><h2>'+E(title)+'</h2>'+body+'</section>';}
function render(){const q=$('wr-filter').value.toLowerCase();let html='';if(r.error||r.outcome==='failed'||r.unresolved?.length)html+='<p class="wr-warning">'+E(r.error||'Uncertain outcomes need explicit resolution before resume.')+'</p>';if(r.text)html+=section('Copyable task briefing','<pre class="wr-briefing">'+E(r.text)+'</pre>');if(r.summary)html+=section('Task goal and findings','<p>'+E(r.summary)+'</p>');if(r.progress?.content)html+=section('Progress','<pre>'+E(r.progress.content)+'</pre>');if(r.counts)html+=section('Observed progress',table([r.counts],Object.keys(r.counts)));if(r.dependencies){const rows=r.dependencies.filter(v=>matches(v,q)),files=new Map();for(const row of rows){const f=row.file||row.path||'Unmapped source';if(!files.has(f))files.set(f,[]);files.get(f).push(row);}html+=section('Dependency declarations · '+rows.length,[...files].map(([file,deps])=>'<details class="wr-file"><summary>'+E(file)+' · '+deps.length+' declarations</summary>'+table(deps.map(v=>({dependency:v.coordinate||v.dependency||[v.group,v.artifact||v.name].filter(Boolean).join(':'),version:v.version,state:v.state||v.resolution,owner:v.owner?[v.owner.path,v.owner.line].filter(Boolean).join(':'):'Unresolved',reason:v.reason})),['dependency','version','state','owner','reason'])+'</details>').join('')||'<p>No matching declarations.</p>');}if(r.checkpoints){const rows=Object.entries(r.checkpoints).map(([path,v])=>({path,type:v.type,state:v.state,result:v.result===undefined?'Not retained':JSON.stringify(v.result).slice(0,180)})).filter(v=>matches(v,q));html+=section('Leaf checkpoints',table(rows,['path','type','state','result']));}if(r.changes)html+=section('Reviewed version changes',table(r.changes.filter(v=>matches(v,q)).map(v=>({file:v.path,before:v.value,after:r.version||'See plan',affected:v.affected||v.dependency||''})),['file','before','after','affected']));const tasks=r.continuations||r.definitions||r.repositories||r.runs;if(tasks)html+=section('Retained items',table(tasks.filter(v=>matches(v,q)).slice(0,100).map(v=>({name:v.title||v.taskId||v.repo||v.id,state:v.state||v.status||'',revision:(v.revision||v.sha||'').slice(0,16),id:v.id||v.revision||''})),['name','state','revision','id']));if(r.files){const files=r.files.filter(v=>matches(v,q));const tree={};for(const f of files){const parts=String(f.path||f).split('/');let n=tree;for(const part of parts){n[part]||={};n=n[part];}}const draw=n=>Object.entries(n).map(([name,c])=>Object.keys(c).length?'<details open><summary>'+E(name)+'</summary><div class="wr-directory">'+draw(c)+'</div></details>':'<div class="wr-file">'+E(name)+'</div>').join('');html+=section('Retained files · '+files.length,draw(tree));}if(!html)html='<p>Inspect the complete retained record below. No work is running from this snapshot.</p>';$('wr-main').innerHTML=html;}$('wr-filter').oninput=render;$('wr-export').onclick=()=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([pretty(d)],{type:'application/json'}));a.href=u;a.download='work-record.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};render();})();</script>
