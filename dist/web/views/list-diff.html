<!-- {"description": "Two lists compared: only in the first, in both, only in the last. DATA: { first, last, labels: [a, b] } or a diffLists() result with labels", "sample": {"labels": ["database", "sftp file"], "first": [1001, 1002, 1003, 1004, 1005], "last": ["1003", "1004", "1005", "1006", "1007", "1007"]}} -->
<div class="vhead"><h1 data-title></h1><span class="muted" id="info"></span><span class="spacer"></span>
  <input id="q" placeholder="filter" style="width:160px"></div>
<div class="bar" id="bar"></div>
<div class="cols3" id="cols"></div>
<p class="muted" id="dups"></p>
<script>
  const labels = DATA.labels || ['first', 'last'];
  const d = DATA.onlyFirst ? DATA : dt.diffLists(DATA.first, DATA.last, DATA.options);
  dt.title(META.title || `${labels[0]} vs ${labels[1]}`);
  const c = d.counts;
  dt.$('#info').textContent = d.same ? 'the same' : `${c.onlyFirst + c.onlyLast} differences · ${c.first} vs ${c.last} values`;
  const total = Math.max(1, c.onlyFirst + c.common + c.onlyLast);
  dt.$('#bar').innerHTML = [['a', c.onlyFirst], ['c', c.common], ['b', c.onlyLast]].map(([k, n]) => `<span class="${k}" style="width:${100 * n / total}%"></span>`).join('');
  const col = (cls, title, items, q) => {
    const shown = items.filter(v => !q || String(v).toLowerCase().includes(q));
    return `<div class="col ${cls}"><h3>${dt.esc(title)}<span class="n">${items.length}</span></h3>${shown.length ? `<ul>${shown.slice(0, 5000).map(v => `<li>${dt.esc(v)}</li>`).join('')}</ul>` : '<div class="empty muted">none</div>'}
      <div style="padding:6px 10px;border-top:1px solid var(--line)"><button class="small" data-copy="${cls}">Copy</button></div></div>`;
  };
  const draw = () => {
    const q = dt.$('#q').value.trim().toLowerCase();
    dt.$('#cols').innerHTML = col('a', `Only in ${labels[0]}`, d.onlyFirst, q) + col('c', 'In both', d.common, q) + col('b', `Only in ${labels[1]}`, d.onlyLast, q);
  };
  draw();
  dt.$('#q').oninput = draw;
  dt.$('#cols').onclick = (e) => { const k = e.target.dataset.copy; if (k) dt.copy(({ a: d.onlyFirst, c: d.common, b: d.onlyLast })[k].join('\n'), e.target); };
  const dup = [[c.duplicatesFirst, labels[0], d.duplicatesFirst], [c.duplicatesLast, labels[1], d.duplicatesLast]].filter(([n]) => n).map(([n, l, xs]) => `${n} in ${l} (${xs.slice(0, 10).join(', ')}${n > 10 ? ', …' : ''})`);
  if (dup.length) dt.$('#dups').textContent = `Listed more than once: ${dup.join('; ')}`;
</script>
