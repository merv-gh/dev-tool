<style>
.exchange-url{font:12px/1.6 ui-monospace,Menlo,monospace;overflow-wrap:anywhere;flex:1;min-width:0}.exchange-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 16px;font-variant-numeric:tabular-nums}.exchange-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.exchange-side{min-width:0}.exchange-side h2{margin-top:0}.exchange-body{max-height:550px;overflow:auto;padding:12px}.exchange-evidence{padding:10px 12px;margin:14px 0;font-size:12px;overflow-wrap:anywhere}.exchange-headers{overflow:auto;max-height:220px}.exchange-controls{display:flex;gap:6px;margin-bottom:8px;align-items:center;flex-wrap:wrap}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}::selection{background:var(--accent-soft);color:var(--fg)}.exchange-gaps{color:var(--warn);overflow-wrap:anywhere}.exchange-body pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}@media(max-width:720px){.vhead{flex-wrap:wrap}.exchange-url{flex:1 1 100%;order:2}.vhead #client{margin-left:auto}.exchange-grid{grid-template-columns:minmax(0,1fr)}}
</style>
<div class="vhead"><h1>API exchange</h1><span class="pill" id="method"></span><span class="exchange-url" id="url"></span><button id="client">Copy API client URL</button></div>
<div class="exchange-meta"><span class="chip" id="status"></span><span id="duration" class="muted"></span><span id="source" class="muted"></span><span class="spacer"></span><button id="download">Download sanitized exchange</button></div>
<div id="evidence" class="card exchange-evidence"></div><div id="gaps" class="exchange-gaps"></div>
<div class="exchange-grid"><section class="exchange-side"><h2>Request</h2><div class="exchange-controls"><button data-copy="request">Copy JSON</button><span class="muted" id="request-type"></span></div><div id="request-body" class="card exchange-body"></div><details><summary>Request headers</summary><div id="request-headers" class="exchange-headers"></div></details></section><section class="exchange-side"><h2>Response</h2><div class="exchange-controls"><button data-copy="response">Copy JSON</button><span class="muted" id="response-type"></span></div><div id="response-body" class="card exchange-body"></div><details><summary>Response headers</summary><div id="response-headers" class="exchange-headers"></div></details></section></div>
<details style="margin-top:16px"><summary>Provenance and redactions</summary><div id="provenance"></div></details>
<script>
const e=DATA;dt.title('API exchange');dt.$('#method').textContent=e.request.method;dt.$('#method').classList.add(e.request.method);dt.$('#url').textContent=e.request.url;
const status=dt.$('#status');status.textContent=e.response.status?`${e.response.status} ${e.response.statusText||''}`:'No response captured';status.classList.add(e.response.status>=400?'bad':e.response.status?'good':'warn');dt.$('#duration').textContent=e.timing?.durationMs==null?'Timing unavailable':`${e.timing.durationMs} ms`;dt.$('#source').textContent=e.source?.kind||'Import';
const client=dt.$('#client');const clientUrl=META.client||`/api-client?exchange=${encodeURIComponent(e.id)}`;client.onclick=()=>dt.copy(clientUrl,client);
const candidates=e.route?.candidates||[];dt.$('#evidence').textContent=candidates.length?`${e.route.status==='ambiguous'?'Ambiguous route: ':''}${candidates.map(c=>`${c.service} → ${c.handler||c.path}${c.where?' · '+c.where:''}`).join(' | ')}`:'Observed route; no matching cached service endpoint.';
dt.$('#gaps').textContent=(e.gaps||[]).map(g=>`${g.kind}: ${g.reason||g.location||''}`).join(' · ');
for(const side of ['request','response']){const body=e[side].body||{kind:'none'};dt.$(`#${side}-type`).textContent=body.contentType||body.kind;const root=dt.$(`#${side}-body`);if(body.kind==='json')dt.json(root,body.value,{open:3});else{const pre=document.createElement('pre');pre.textContent=body.value??body.reason??'No body';root.append(pre)}dt.table(dt.$(`#${side}-headers`),Object.entries(e[side].headers||{}).map(([name,value])=>({name,value})));}
dt.json(dt.$('#provenance'),{source:e.source,route:e.route,redactions:e.redactions,gaps:e.gaps},{open:2});
document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>dt.copy(JSON.stringify(e[b.dataset.copy],null,2),b));dt.$('#download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(e,null,2)],{type:'application/json'}));a.download=`exchange-${e.id}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script>
