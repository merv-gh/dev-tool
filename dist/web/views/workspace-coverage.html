<style>
.wc-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.wc-head h1{font-size:18px;margin:0}.wc-state{font-weight:600;color:var(--accent)}.wc-note{color:var(--muted);max-width:85ch}.wc-pins{display:flex;gap:8px 24px;flex-wrap:wrap;font-size:12px;margin:12px 0;overflow-wrap:anywhere}.wc-summary{display:flex;gap:18px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.wc-summary b{font-variant-numeric:tabular-nums}.wc-good{color:var(--good)}.wc-bad{color:var(--bad)}.wc-warn{color:var(--warn)}.wc-grid{display:grid;grid-template-columns:minmax(200px,28%) minmax(0,1fr);gap:18px;margin-top:20px}.wc-grid>*{min-width:0}.wc-files{display:grid;gap:4px;align-content:start}.wc-files button{font:inherit;text-align:left;border:1px solid transparent;background:transparent;border-radius:5px;padding:9px;color:var(--fg);overflow-wrap:anywhere;cursor:pointer}.wc-files button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}.wc-files small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.wc-detail h2{font-size:14px;margin:0 0 12px;overflow-wrap:anywhere}.wc-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;margin:10px 0}.wc-toolbar label{display:inline-flex;gap:7px;align-items:center}.wc-toolbar label input{margin:0}.wc-lines{display:grid;gap:3px}.wc-line{display:grid;grid-template-columns:46px 96px minmax(0,1fr);gap:8px;padding:8px 6px;border-bottom:1px solid var(--line);align-items:baseline}.wc-line code{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,Menlo,monospace}.wc-line small{display:block;color:var(--muted);font:11px/1.6 system-ui}.wc-num{font:12px ui-monospace,Menlo,monospace;color:var(--muted)}.wc-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0;font-size:12px}.wc-actions a{min-height:34px;align-content:center}.wc-gaps{padding:10px 12px;background:var(--warn-bg);color:var(--warn);border-radius:5px;margin:14px 0}.wc-gaps p{margin:3px 0}.wc-empty{color:var(--muted);padding:16px 0}.wc-root :focus-visible{outline:2px solid var(--focus);outline-offset:3px}@media(max-width:640px){.wc-grid{grid-template-columns:1fr}.wc-files{max-height:230px;overflow:auto}.wc-line{grid-template-columns:32px 78px minmax(0,1fr);gap:5px;padding:8px 0}.wc-summary{gap:10px 18px}.wc-line code{font-size:11px}.wc-actions a{min-height:40px}}

<article class="wc-root">
 <header class="wc-head"><h1>Changed code coverage</h1><span id="wc-state" class="wc-state"></span></header>
 <p class="wc-note">Executable lines added or modified in this change. Covered means executed; assertions and business behavior need their own proof.</p>
 <div id="wc-pins" class="wc-pins"></div><div id="wc-summary" class="wc-summary"></div><div id="wc-gaps" class="wc-gaps" hidden></div>
 <div class="wc-grid"><nav id="wc-files" class="wc-files" aria-label="Changed production files"></nav><section class="wc-detail"><h2 id="wc-path">Select a changed file</h2><div class="wc-toolbar"><label><input type="checkbox" id="wc-only" checked> Uncovered lines and branches only</label><span id="wc-line-count" role="status"></span></div><div id="wc-lines" class="wc-lines"></div><div class="wc-actions"><a id="wc-read" target="_blank" rel="noopener noreferrer">Prepare source read</a><a id="wc-rerun" target="_blank" rel="noopener noreferrer" hidden>Prepare coverage run</a><button id="wc-copy">Copy regression briefing</button><a id="wc-download" download="change-coverage.json">Download JSON</a></div></section></div>
 <details><summary>Measurement identity, artifacts and limits</summary><div id="wc-json"></div></details>
</article>
<script>
(()=>{const d=DATA||{},s=d.summary||{},files=d.files||[],esc=dt.esc,$=id=>document.getElementById(id);let selected=files.findIndex(f=>f.lines?.some(l=>l.state==='missed'||l.state==='unknown'||l.missedBranches));if(selected<0)selected=0;
 $('wc-state').textContent=d.stale||d.state==='stale'?'Stale · collect again':s.fullyCovered?'Changed executable lines covered':d.state||'No measurement';if(d.stale||d.state==='stale')$('wc-state').classList.add('wc-warn');
 $('wc-pins').innerHTML=[['Workspace',d.workspace],['Base',d.base],['Source',d.sourceFingerprint],['Tests',d.testOutcome]].filter(([,v])=>v).map(([k,v])=>'<span>'+esc(k)+': <code>'+esc(v)+'</code></span>').join('');
 $('wc-summary').innerHTML=[['Covered',s.covered,'wc-good'],['Missed',s.missed,'wc-bad'],['Unknown',s.unknown,'wc-warn'],['Non-executable',s.nonExecutable,''],['Changed-line coverage',s.percent==null?s.complete&&s.executable===0?'No executable changes':'Not measured':s.percent+'%',''],['Missed branches',s.missedBranches,'wc-bad']].map(([k,v,c])=>'<span class="'+c+'"><b>'+esc(v??0)+'</b> '+esc(k)+'</span>').join('');
 const gaps=[...(d.gaps||[]),...(!s.complete?['Measurement is incomplete or source identity is unverified. Percentages cover measured executable lines only.']:[]),...(d.stale||d.state==='stale'?['These results belong to earlier workspace inputs. Collect fresh coverage before using them for this change.']:[])];if(gaps.length){$('wc-gaps').hidden=false;$('wc-gaps').innerHTML=gaps.map(g=>'<p>'+esc(g)+'</p>').join('');}
 function draw(){
  $('wc-files').innerHTML=files.map((f,i)=>'<button data-file="'+i+'" aria-pressed="'+(i===selected)+'">'+esc(f.path)+'<small>'+esc(f.deleted?'Deleted · no current lines':`${f.counts?.covered||0} covered · ${f.counts?.missed||0} missed · ${f.counts?.unknown||0} unknown`)+'</small></button>').join('');
  const f=files[selected];if(!f){$('wc-lines').innerHTML='<p class="wc-empty">No changed production files in this report.</p>';$('wc-read').hidden=true;return;}$('wc-path').textContent=f.path;
  const lines=(f.lines||[]).filter(l=>!$('wc-only').checked||l.state==='missed'||l.state==='unknown'||l.missedBranches);$('wc-line-count').textContent=lines.length+' shown · '+(f.lines||[]).length+' changed lines';
  $('wc-lines').innerHTML=lines.length?lines.map(l=>'<div class="wc-line"><span class="wc-num">'+esc(l.line)+'</span><span class="'+(l.state==='missed'?'wc-bad':l.state==='unknown'?'wc-warn':l.state==='covered'?'wc-good':'')+'">'+esc(l.state)+(l.missedBranches?'<small>'+esc(l.missedBranches)+' branches missed</small>':'')+'</span><code>'+esc(l.source||'Source excerpt not retained; read this exact revision.')+'</code></div>').join(''):'<p class="wc-empty">No uncovered lines in this selection. Toggle the filter to inspect all changed lines.</p>';
  const args={workspace:d.workspace,path:f.path,from:Math.max(1,(lines[0]?.line||1)-3),to:(lines[0]?.line||1)+12},p=new URLSearchParams({tool:'workspace_read',args:JSON.stringify(args),...(META.scope?.story?{story:META.scope.story}:{})});$('wc-read').href=new URL('/admin#workbench?'+p,META.publicUrl||location.href).href;
 }
 if(d.tests?.length){$('wc-rerun').hidden=false;const q=new URLSearchParams({tool:'test_run',args:JSON.stringify({workspace:d.workspace,tests:d.tests,coverage:true,coverage_base:d.base}),...(META.scope?.story?{story:META.scope.story}:{})});$('wc-rerun').href=new URL('/admin#workbench?'+q,META.publicUrl||location.href).href;}
 $('wc-files').onclick=e=>{const b=e.target.closest('[data-file]');if(b){selected=Number(b.dataset.file);draw();$('wc-files').querySelector('[data-file=\"'+selected+'\"]')?.focus();}};$('wc-only').onchange=draw;
 $('wc-copy').onclick=e=>{const f=files[selected];dt.copy(JSON.stringify({workspace:d.workspace,base:d.base,sourceFingerprint:d.sourceFingerprint,state:d.state,path:f?.path,uncovered:f?.lines?.filter(l=>l.state==='missed'||l.state==='unknown'||l.missedBranches),next:'Choose an entry-to-exit regression; cover these lines and branches, assert observable effects, then collect fresh change coverage.'},null,2),e.target);};
 $('wc-download').href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));dt.json($('wc-json'),d,{open:1});draw();})();
</script>
