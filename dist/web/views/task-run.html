<style>.task-snapshot header{display:flex;justify-content:space-between;gap:12px;align-items:baseline}.task-snapshot h1{font-size:19px;margin:0}.task-snapshot p{max-width:75ch}.task-snapshot pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto}.task-snapshot details{margin-top:16px}.task-snapshot .snapshot-state{color:var(--muted)}.task-snapshot a{display:inline-block;margin:8px 0}</style>
<main class="task-snapshot"><header><h1 id="taskTitle"></h1><span id="taskState" class="snapshot-state"></span></header><p id="taskReason"></p><p id="taskCounts" class="hint"></p><a id="taskOpen" target="_blank" rel="noopener">Open live task desk</a><details id="taskEvidence"><summary>Retained activity snapshot</summary><pre id="taskRaw"></pre></details><p class="hint">This is a saved snapshot. Opening it does not start, resume or compact a task.</p></main>
<script>(()=>{const r=DATA;document.getElementById('taskTitle').textContent=r.title||'Autonomous task';document.getElementById('taskState').textContent=String(r.state||'').replaceAll('_',' ');document.getElementById('taskReason').textContent=r.reason||'Task admitted on the server. The browser may be closed.';document.getElementById('taskCounts').textContent=(r.counts?.steps||0)+' steps · '+(r.counts?.modelCalls||0)+' model calls · '+(r.counts?.toolCalls||0)+' tool calls';document.getElementById('taskOpen').href='/tasks?run='+encodeURIComponent(r.id);document.getElementById('taskRaw').textContent=JSON.stringify({events:r.events,watch:r.watch,publication:r.publication,codePublications:r.codePublications},null,2);document.getElementById('taskEvidence').open=r.state==='needs_attention';})();</script>
