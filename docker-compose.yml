# dt: the tool server (always). Tools over OpenAPI (Open WebUI) and MCP (/mcp), result pages, /admin.
#                                                          -> http://127.0.0.1:4000/admin
# Optional parts, picked with COMPOSE_PROFILES (in .env.personal; run.sh defaults to all three):
#   webui:   Open WebUI chat + one-shot setup              -> http://127.0.0.1:3000
#   browser: Playwright MCP (headless Chromium); logins use secrets from .env.browser
#   graph:   code-review-graph over repos/ (fetched by passports / repo_fetch), via mcpo as OpenAPI
#   jdk:     JDK 21 + Maven for test_run, copied once from the official Maven image into a volume dt mounts
#   testdb:  scratch Postgres for test_run: each run gets a throwaway database loaded with a DDL snapshot
# Config and data live in one folder (DT_HOME_DIR, set by run.sh --home; default: this folder):
#   config.json, .env, notes.json, plugins/, scripts/, cache/, repos/, passports/
# Only the tool server, for an Open WebUI or MCP client you already run:  ./run.sh --tools-only up -d
name: dev-tool

services:
  dt:
    # No image to build: a stock node image (with git, for passports) runs the bundled dist/dt.js.
    image: ${DT_NODE_IMAGE:-node:22-bookworm}
    command: ["node", "/app/dt.js", "start"]
    user: "${DT_UID:-1000}:${DT_GID:-1000}"
    environment:
      DT_TRUST_NETWORK: ${DT_TRUST_NETWORK:-1}             # trust the compose network; the port is published on DT_BIND only
      DT_API_KEY: ${DT_API_KEY:-}                          # if set, required from anything not trusted (Bearer or /admin?key=)
      # empty = use config.json (server.publicUrl / server.ratePerSec / tools.enable+disable)
      DT_PUBLIC_URL: ${DT_PUBLIC_URL:-}                    # base of result links/embeds as the chat user's browser sees it
      DT_PUBLISHED_PORT: ${DT_PORT:-4000}                  # default public URL: http://127.0.0.1:<this>
      DT_RATE_PER_SEC: ${DT_RATE_PER_SEC:-}
      DT_TOOLS: ${DT_TOOLS:-}
      DT_TOOL_PROFILE: ${DT_TOOL_PROFILE:-compact}          # small initial Open WebUI tool list; discover exact tools on demand
      GRAPH_URL: ${GRAPH_URL:-http://graph:8000}
      DT_BROWSER_MCP: ${DT_BROWSER_MCP:-http://browser:8931/mcp}  # dt drives the browser for saved scripts / route discovery
      DT_HOME: /dt
      # git's data: a volume (the config folder may be a mount where git cannot chmod; /tmp is lost on restart)
      DT_GIT_DIR: ${DT_GIT_DIR:-/var/dt-git}
      # test_run: the jdk profile's JDK + Maven (used when present). Workspaces, the Gradle home and the Maven
      # repository live on volumes, not in the config folder: builds need file locks and memory-mapped files,
      # which a Windows / SMB / some macOS bind mounts do not do right (Gradle's daemon registry hangs there)
      DT_JAVA_HOME: ${DT_JAVA_HOME:-/opt/jdk/java}
      DT_MAVEN: ${DT_MAVEN:-/opt/jdk/maven/bin/mvn}
      DT_WORK_DIR: ${DT_WORK_DIR:-/var/dt-work}
      DT_MAVEN_REPO: ${DT_MAVEN_REPO:-/var/dt-build/m2}
      DT_GRADLE_USER_HOME: ${DT_GRADLE_USER_HOME:-/var/dt-build/gradle}
      DT_TEST_DB_URL: ${DT_TEST_DB_URL:-postgres://dt:dt@testdb:5432/postgres}
      # builds run on the runner (jdk profile): Docker for Testcontainers there, no dt secrets; without it, here
      DT_RUNNER_URL: ${DT_RUNNER_URL:-http://runner:4100}
      DT_RUNNER_TOKEN: ${DT_RUNNER_TOKEN:-}
      DT_BUILD_DIR: /var/dt-build
      PORT: 4000
      NODE_ENV: production
      HOME: /tmp                                           # git needs a writable home; the uid may not exist in the image
    volumes:
      - ./dist:/app:ro          # the code: bundle + web pages (npm run build); a restart picks up a rebuild
      - ${DT_HOME_DIR:-.}:/dt   # config.json, .env, notes, plugins, scripts/, cache/, repos/, passports/, work/
      - jdk:/opt/jdk:ro         # filled by the jdk profile; empty otherwise
      - dt-git:/var/dt-git      # git data of fetched repos and workspaces
      - dt-work:/var/dt-work    # workspaces (checkouts where tests are written and run)
      - dt-build:/var/dt-build  # Gradle home (caches, daemon, build cache) and Maven repository
    depends_on:
      jdk: { condition: service_completed_successfully, required: false }
      init: { condition: service_completed_successfully }
    ports:
      - "${DT_BIND:-127.0.0.1}:${DT_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  browser:
    profiles: [browser]
    image: mcr.microsoft.com/playwright/mcp:${PLAYWRIGHT_MCP_VERSION:-v0.0.83}
    command: ["--port", "8931", "--host", "0.0.0.0", "--allowed-hosts", "*", "--isolated",
              "--secrets", "/secrets/browser.env", "--viewport-size", "1366,900",
              "--output-dir", "/tmp/playwright", "--image-responses", "allow"]
    user: "${DT_UID:-1000}:${DT_GID:-1000}"                 # same user as dt, which writes the 0600 secrets file
    environment:
      HOME: /tmp
    volumes:
      - ${DT_HOME_DIR:-.}/cache/browser.env:/secrets/browser.env:ro   # written by dt from browser.sites; only this container sees the values
    depends_on:
      dt: { condition: service_healthy }
    restart: unless-stopped

  graph:
    profiles: [graph]
    build:
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
      dockerfile_inline: |
        FROM python:3.12-slim
        ARG PIP_INDEX_URL
        RUN apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*
        RUN pip install --no-cache-dir --index-url "$$PIP_INDEX_URL" code-review-graph==2.3.9 mcpo==0.0.20 fastapi==0.133.1   # mcpo 0.0.20 breaks on newer FastAPI
        RUN mkdir -p /repos && git config --system --add safe.directory '*'
    image: dev-tool-graph:latest
    command: ["mcpo", "--host", "0.0.0.0", "--port", "8000", "--", "code-review-graph", "serve", "--repo", "/repos"]
    user: "${DT_UID:-1000}:${DT_GID:-1000}"
    environment:
      HOME: /tmp
    volumes:
      - ${DT_HOME_DIR:-.}/repos:/repos   # graph data is written next to each repo (.code-review-graph/)
    restart: unless-stopped

  # Runs the builds of test_run (Maven, Gradle, javac, the test JVM) for dt: the JDK, the workspaces and build
  # caches, and the host's Docker for Testcontainers. No config folder, no secrets: dt sends each command with
  # what that build needs. Reachable only on this network, and only with DT_RUNNER_TOKEN (run.sh makes one).
  runner:
    profiles: [jdk]
    image: ${DT_NODE_IMAGE:-node:22-bookworm}
    command: ["node", "/app/dt.js", "runner", "--port", "4100"]
    user: "${DT_UID:-1000}:${DT_GID:-1000}"
    group_add: ["${DT_DOCKER_GID:-0}"]   # the Docker socket's group (Docker Desktop: 0)
    environment:
      HOME: /tmp
      DT_HOME: /tmp/dt-runner
      DT_RUNNER_TOKEN: ${DT_RUNNER_TOKEN:-}
      DT_WORK_DIR: ${DT_WORK_DIR:-/var/dt-work}
      DT_BUILD_DIR: /var/dt-build
      DT_JAVA_HOME: ${DT_JAVA_HOME:-/opt/jdk/java}
      DT_MAVEN: ${DT_MAVEN:-/opt/jdk/maven/bin/mvn}
      DOCKER_HOST: unix:///var/run/docker.sock
      # Testcontainers starts containers on the host's Docker; the tests reach their ports through the host
      TESTCONTAINERS_HOST_OVERRIDE: ${TESTCONTAINERS_HOST_OVERRIDE:-host.docker.internal}
      TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /var/run/docker.sock
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ${TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./dist:/app:ro
      - jdk:/opt/jdk:ro
      - dt-work:/var/dt-work
      - dt-build:/var/dt-build
      - ${DT_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      jdk: { condition: service_completed_successfully }
      init: { condition: service_completed_successfully }
    restart: unless-stopped

  # One-shot: the volumes belong to dt's user (a new volume belongs to root)
  init:
    image: ${DT_NODE_IMAGE:-node:22-bookworm}
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /var/dt-build/gradle /var/dt-build/m2 && chown ${DT_UID:-1000}:${DT_GID:-1000} /var/dt-git /var/dt-work /var/dt-build /var/dt-build/gradle /var/dt-build/m2"]
    volumes:
      - dt-git:/var/dt-git
      - dt-work:/var/dt-work
      - dt-build:/var/dt-build
    restart: "no"

  # One-shot: copy the JDK and Maven of the official image into the jdk volume (again when the image changes).
  # glibc builds, so they run in the node (Debian) image of dt.
  jdk:
    profiles: [jdk]
    image: maven:${MAVEN_IMAGE_TAG:-3.9-eclipse-temurin-21}
    command:
      - sh
      - -c
      - |
        set -e
        v=$$(cat /opt/java/openjdk/release /usr/share/maven/lib/maven-core-*.jar | md5sum | cut -c1-12)
        if [ ! -f /jdk/.v-$$v ]; then
          rm -rf /jdk/java /jdk/maven /jdk/.v-*
          cp -a /opt/java/openjdk /jdk/java && cp -a /usr/share/maven /jdk/maven && touch /jdk/.v-$$v
        fi
        echo "jdk ready: $$(/jdk/java/bin/java -version 2>&1 | head -1)"
    volumes:
      - jdk:/jdk
    restart: "no"

  testdb:
    profiles: [testdb]
    image: postgres:${TESTDB_POSTGRES_VERSION:-16-alpine}
    environment:
      POSTGRES_USER: dt
      POSTGRES_PASSWORD: dt
    tmpfs:
      - /var/lib/postgresql/data      # throwaway: nothing to keep
    command: ["postgres", "-c", "fsync=off", "-c", "full_page_writes=off", "-c", "synchronous_commit=off"]
    restart: unless-stopped           # no ports: only dt reaches it on the compose network

  webui:
    profiles: [webui]
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_VERSION:-v0.12.4}
    environment:
      OPENAI_API_BASE_URL: ${LLM_BASE_URL:-}                # set LLM_BASE_URL in .env.personal
      OPENAI_API_KEY: ${LLM_API_KEY:-none}
      DEFAULT_MODELS: ${LLM_MODEL:-}
      ENABLE_OLLAMA_API: "false"
      WEBUI_AUTH: "false"                                  # single local user (admin)
      ENABLE_PERSISTENT_CONFIG: "false"                    # this file stays the source of truth on every start
      ENABLE_TOOL_SERVERS: "true"
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"           # tool calls say which chat they come from: dt reuses that chat's workspace
      # ~80 tools (Open WebUI built-ins + dt + browser) would crowd the model's context.
      # Keep the everyday ones loaded; the rest stay reachable through Open WebUI's search_tools.
      ENABLE_TOOL_SEARCH: "true"
      TOOL_SEARCH_DEFER_THRESHOLD: "0"
      TOOL_SEARCH_ALWAYS_LOADED: >-
        find,catalog_sync,pg_table,pg_function,pg_usage,pg_query,es_search,kafka_topic,kafka_last,kafka_lag,health,es_health,overview,consul_service,
        logs_search,logs_trace,passport,who_uses,bitbucket_pr,code_search,impact,workspace_open,test_context,test_run,workspace_write,workspace_patch,showcase,call_history,dt_log,doctor,job_cancel,browser_sites,site_url,api_routes,routes_learn,script_list,script_run,call_patterns,files_stores,files_search,files_read,files_show,files_browse,show,diff,code,
        browser_browser_navigate,browser_browser_snapshot,browser_browser_click,browser_browser_type,browser_browser_fill_form,
        browser_browser_press_key,browser_browser_take_screenshot,browser_browser_wait_for
      # dt over OpenAPI so results can embed the viewer/dashboard in the chat; browser over MCP.
      TOOL_SERVER_CONNECTIONS: >-
        [{"type":"openapi","url":"http://dt:4000","path":"openapi.json","auth_type":"none","key":"",
          "config":{"enable":true},
          "info":{"id":"dt","name":"dt","description":"Postgres, Elasticsearch, Kafka, Consul, logs, Bitbucket, service passports (read-only)"}},
         {"type":"mcp","url":"http://browser:8931/mcp","path":"","auth_type":"none","key":"",
          "config":{"enable":true},
          "info":{"id":"browser","name":"browser","description":"Headless browser: open URLs, click, type, screenshot"}},
         {"type":"openapi","url":"http://graph:8000","path":"openapi.json","auth_type":"none","key":"",
          "config":{"enable":true},
          "info":{"id":"graph","name":"code graph","description":"code-review-graph over fetched repos (/repos/<PROJECT>/<repo>): callers, impact, review context"}}]
    volumes:
      - webui-data:/app/backend/data
    ports:
      - "127.0.0.1:${WEBUI_PORT:-3000}:8080"
    depends_on:
      dt: { condition: service_started }
      browser: { condition: service_started, required: false }
      graph: { condition: service_started, required: false }
    restart: unless-stopped

  # One-shot: after Open WebUI is up, give each model the agent prompt (lib/agent-prompt.md) and
  # turn on the dt / browser / graph tools by default. Safe to rerun: ./run.sh up setup
  setup:
    profiles: [webui]
    image: ${DT_NODE_IMAGE:-node:22-bookworm}
    command: ["node", "/app/dt.js", "webui-setup"]
    user: "${DT_UID:-1000}:${DT_GID:-1000}"
    environment:
      WEBUI_URL: http://webui:8080
      LLM_MODEL: ${LLM_MODEL:-}
      DT_HOME: /dt
    volumes:
      - ./dist:/app:ro
      - ${DT_HOME_DIR:-.}:/dt
    depends_on: [webui]
    restart: "no"

volumes:
  webui-data: {}
  jdk: {}
  dt-git: {}
  dt-work: {}
  dt-build: {}
