# TLS terminates here; the upstream port must remain private.
# Set server.publicUrl to the HTTPS origin and server.trustedProxies to this
# proxy's exact source IP. No identity is accepted from proxy headers.
server {
    listen 443 ssl;
    server_name tools.example.internal;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
}
